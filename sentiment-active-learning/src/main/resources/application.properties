# =============================================================================
# application.properties  ?  COMMON CONFIGURATION
# sentiment-active-learning
#
# This file is the parent configuration shared across all Spring profiles.
# It defines every property that is stable between environments.
#
# Profile-specific files override or extend these values:
#   application-dev.properties   ? local development overrides
#   application-prod.properties  ? production overrides (to be created)
#
# Sensitive values (API keys, passwords, ports) are never hardcoded here.
# They are injected at runtime from environment variables, defined in:
#   .env             ? local development (never committed to Git)
#   .env.template    ? committed placeholder showing required variable names
# =============================================================================


# =============================================================================
# Application
# =============================================================================
spring.application.name=sentiment-active-learning

# Default to dev profile locally. Production overrides this via
# SPRING_PROFILES_ACTIVE environment variable in docker-compose.
spring.profiles.default=dev


# =============================================================================
# Server
# =============================================================================

# Port is environment-specific.
# Dev hardcodes 8080 in application-dev.properties (not committed to Git).
# Production resolves this from APP_PORT in the .env / docker-compose environment.
server.port=${APP_PORT:8080}


# =============================================================================
# Spring Data JPA
# =============================================================================

# Disable open-in-view: this is a REST API with no view rendering layer.
# Leaving it enabled silently keeps database connections open during serialisation,
# which wastes connection pool resources and masks lazy-loading bugs.
spring.jpa.open-in-view=false

# Let Hibernate validate the schema on startup rather than auto-generating it.
# Schema creation is handled explicitly via schema.sql / data.sql.
# Dev profile overrides this to 'create-drop' for a clean slate on every restart.
spring.jpa.hibernate.ddl-auto=validate

# Log SQL statements at DEBUG level (controlled per-profile via logging config).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# =============================================================================
# H2 Database
# =============================================================================

# H2 console is disabled by default for security.
# Enabled only in the dev profile.
spring.h2.console.enabled=false


# =============================================================================
# Actuator
# =============================================================================

# Expose only the health endpoint over HTTP.
# Sufficient for Docker healthcheck; avoids leaking internal metrics.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never


# =============================================================================
# SpringDoc / Swagger UI
# =============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html

# Disable the default SpringDoc sample petstore URL.
springdoc.swagger-ui.disable-swagger-default-url=true

# Sort endpoints alphabetically for easier navigation.
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha


# =============================================================================
# Spring Security ? Swagger Basic Auth
# =============================================================================

# Credentials for protecting the Swagger UI and OpenAPI spec endpoints.
# Values are injected from environment variables; never hardcoded.
swagger.auth.username=${SWAGGER_USERNAME}
swagger.auth.password=${SWAGGER_PASSWORD}


# =============================================================================
# Claude AI ? API Configuration
# =============================================================================

# Anthropic Claude REST API endpoint.
claude.api.url=https://api.anthropic.com/v1/messages

# API key injected from environment variable. Never hardcode this value.
claude.api.key=${CLAUDE_API_KEY}

# Model identifier. Centralised here so it can be updated without touching code.
claude.api.model=claude-sonnet-4-20250514

# Maximum tokens Claude may return per labelling request.
# Kept low: we only need a single POSITIVE/NEGATIVE label per call.
claude.api.max-tokens=16

# HTTP connection and read timeouts for Claude API calls (in milliseconds).
claude.api.connect-timeout-ms=5000
claude.api.read-timeout-ms=15000


# =============================================================================
# Active Learning ? Model Configuration
# =============================================================================

# Confidence threshold below which a prediction is considered uncertain and
# forwarded to Claude for labelling. Range: 0.0 ? 1.0.
# A value of 0.65 means: if the model is less than 65% confident, ask Claude.
active-learning.uncertainty-threshold=0.65

# Number of new Claude-labelled samples required to trigger a model retrain.
# Retraining on every single new sample would be too expensive; batching is cheaper.
active-learning.retrain-batch-size=10

# Minimum number of labelled samples required before the first training run.
# The model cannot train meaningfully on too few examples.
active-learning.min-training-samples=20


# =============================================================================
# Logging
# =============================================================================

# Structured log pattern ? timestamp, level, thread, logger (abbreviated), message.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%t] %-40.40logger{39} : %m%n

# Root log level. Overridden per profile (DEBUG in dev, INFO/WARN in prod).
logging.level.root=INFO
logging.level.io.github.amdespotopoulou=INFO